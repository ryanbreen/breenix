[package]
name = "kernel"
version = "0.1.0"
edition = "2021"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(never)", "cfg(feature, values(\"ec0_fault_inject\", \"particle_animation\", \"receipt_drop_test\", \"xhci_linux_harness\"))"] }

[[bin]]
name = "kernel"
path = "src/main.rs"
test = false
bench = false

[[bin]]
name = "kernel-aarch64"
path = "src/main_aarch64.rs"
test = false
bench = false

[lib]
name = "kernel"
path = "src/lib.rs"
test = false

[features]
testing = []
boot_tests = []  # Parallel boot test framework
force_eret_dispatch_596 = ["boot_tests"]  # #596 forced-repro knob
ret_zero_pc_oracle = ["boot_tests"]
ret_zero_pc_oracle_exec = ["boot_tests"]
ret_stack_pc_oracle = ["boot_tests"]
ret_floor_oracle = ["boot_tests"]
resume_pc_foreign_oracle = ["boot_tests"]
strand_inject_live_outgoing = ["boot_tests"]
resume_pc_el1_oracle = ["boot_tests"]
eret_zero_pc_oracle = ["boot_tests"]
resume_pc_el0_kernel_oracle = ["boot_tests"]
resume_pc_el0_tid_oracle = ["boot_tests"]
resume_pc_el0_frame_oracle = ["boot_tests"]
resume_pc_oracle_disarm = ["boot_tests"]
lr_poison_oracle = ["boot_tests"]  # saved-LR custody mutation leg
percpu_stack_custody_oracle = ["boot_tests"]
arm_a_609 = ["boot_tests"]  # #609 arm-A placement oracle

# Core-proof harness (R60 pilot). Test profile only: it rides `boot_tests` and
# every byte of it is behind `#[cfg(feature = "coreproof")]`. Two ratchets prove
# the production profile carries none of it -- `scripts/check-coreproof-seams.sh`
# (source) and `tests/coreproof_production_clean.rs` (binary).
coreproof = ["boot_tests"]
# The six planted known-fixed defects the pilot re-finds. Each is a one-line
# re-introduction at the real site, cited to the PR that fixed it, and each
# implies `coreproof` so a mutation can never be built without the harness that
# scores it.
coreproof_mut_block_departure = ["coreproof"]
coreproof_mut_cpu_identity = ["coreproof"]
coreproof_mut_reclaim_bracket = ["coreproof"]
coreproof_mut_pending_next = ["coreproof"]
coreproof_mut_futex_section = ["coreproof"]
coreproof_mut_masked_lock = ["coreproof"]
# M7 (rung 2): the bare-`spin::Mutex` half of #609's real defect, faithfully
# reintroduced alongside the existing `coreproof_mut_masked_lock` unmasked-drop
# arm so both halves of the original chain are present together. See
# `kernel/src/proof/mutations.rs` for why this is a sibling entry rather than a
# rewrite of M6.
coreproof_mut_masked_lock_bare = ["coreproof"]
# Rung 3: `#607` — the null-scheduler-ptr fallback abandons the outgoing
# thread's own requeue (and leaves `previous_thread` stale). Fixed by PR #634
# (commit ddd03a11). See `kernel/src/proof/mutations.rs` for the register
# entry and `kernel/src/arch_impl/aarch64/context_switch.rs`'s
# `inline_schedule_trampoline` for the re-introduction site.
coreproof_mut_outgoing_fallback_requeue = ["coreproof"]
# Rung 1's driver, now named explicitly rather than selected by the ABSENCE of
# `coreproof_component_c` (rung 3 review hazard: a third component's own
# negative-selector guard would otherwise silently compile against Component
# A's `SiteId` variants the moment it existed). Every per-component guard in
# `kernel/src/task/scheduler.rs` and `kernel/src/proof/{mod,sites}.rs` is a
# POSITIVE per-component list because of this.
coreproof_component_a = ["coreproof"]
# Rung 2: Component C (per-CPU identity + stack custody). Mutually exclusive
# with the other component drivers at compile time — selects which of
# `driver_a`/`driver_c`/`driver_h` `proof::start()` spawns and which
# component-scoped `SiteId` set `kernel/src/proof/sites.rs` builds with.
coreproof_component_c = ["coreproof"]
# Rung 3: Component H (dispatch admission — the `INLINE_SCHEDULE_STATE`
# handoff-slot discipline and the `pending_next` conservation discipline).
# Mutually exclusive with the other component drivers, same mechanism as
# `coreproof_component_c` above.
coreproof_component_h = ["coreproof"]
# #533 x86 staged-registry dispatch. OFF by default: the dispatch itself works
# (SerialBoot + all 70 EarlyBoot tests pass), but the boot thread is stranded
# when the last EarlyBoot subsystem kthread exits, so PostScheduler and
# ProcessContext never run and the boot never returns to userspace. See
# docs/planning/green-program/tracing/X86-533-2026-08-28.md.
x86_staged_registry = ["boot_tests"]
# ext2/VFS fault-injection leg. Test profile only: the module and both of its
# call sites are behind this feature, and the pair of ratchets
# (`scripts/check-fs-fault-production-clean.sh`, `tests/fs_fault_production_clean.rs`)
# prove a production ELF carries none of it.
fs_fault_inject = []
# Anti-vacuity: each disarm feature turns exactly one shape's arming into a
# no-op while leaving its assertion in place, so that shape's arm must report
# `verdict=FAIL detail=fault-not-observed` and the gate must go red.
fs_fault_disarm_short_read = ["fs_fault_inject"]
fs_fault_disarm_eio = ["fs_fault_inject"]
fs_fault_disarm_corrupt_inode = ["fs_fault_inject"]
# #728 gate-observable repro oracle for ext2 lock discipline. Test profile
# only: the module and both of its call sites are behind this feature, and it
# requires boot_tests for kthread_run_on_cpu_for_test's aarch64 CPU pinning.
ext2_lock_race = ["boot_tests"]
btrt = []  # Boot Test Result Table (structured test results)
kthread_test_only = ["testing"]  # Run only kthread tests and exit
xhci_linux_harness = []  # Build and use the Linux C-based xHCI harness
kthread_stress_test = ["testing"]  # Run kthread stress test (100+ kthreads) and exit
workqueue_test_only = ["testing"]  # Run only workqueue tests and exit
dns_test_only = ["testing", "external_test_bins"]  # Run only DNS test and exit (fast network debugging)
blocking_recv_test = ["testing", "external_test_bins"]  # Run only blocking recvfrom test and exit
nonblock_eagain_test = ["testing", "external_test_bins"]  # Run only nonblock EAGAIN test and exit
test_divide_by_zero = []
test_invalid_opcode = []
test_page_fault = []
test_userspace = []
test_all_exceptions = []
external_test_bins = []
ec0_fault_inject = []  # Inject one EL1 UDF on CPU 0 after about 10 seconds
receipt_drop_test = ["boot_tests"]  # Deliberately exercise RetirementReceipt::drop
vmnet = []  # Use vmnet network config (192.168.64.x) instead of SLIRP (10.0.2.x)
interactive = ["testing"]  # Boot into init_shell instead of running automated tests
# #673 anti-vacuity knob (#673 review, M3/mi1): building with this feature
# (and neither `testing` nor `interactive`) compiles ONLY the init-launch
# block back out -- NOT byte-for-byte the pre-#673 kernel. The rest of this
# branch's fixes (the scheduler blocked-state fix, the timer TOCTOU fix, the
# console-executor kthread) stay in the tree regardless. It reproduces the
# one property the extended prod-profile gate's anti-vacuity leg needs: a
# kernel that never constructs a userspace process, so that gate can prove
# it discriminates the fix rather than passing either way. Not implied by
# any other feature, and not meant to ship enabled.
disable_x86_prod_init = []
# #772 anti-vacuity switch. Keeps the three DISPATCH_* census counters wired
# exactly as the fix wires them, and turns ONLY the refusal at
# `kernel/src/interrupts/context_switch.rs`'s need_resched gate into a no-op --
# so the red-on-main arm and the anti-vacuity arm are one build flag apart and
# the census stays comparable across them. Not implied by any other feature,
# and not meant to ship enabled. Mirrors the `coreproof_mut_*` mutation
# convention.
no_progress_refusal_disabled = []

[dependencies]
bootloader_api = { git = "https://github.com/rust-osdev/bootloader.git", rev = "707db11201b19541b7cfef84037866ee03aa0927" }
embedded-graphics = "0.8.1"
conquer-once = { version = "0.4.0", default-features = false }
log = { version = "0.4.17", default-features = false }
spin = "0.9.8"
crossbeam-queue = { version = "0.3", default-features = false, features = ["alloc"] }
futures-util = { version = "0.3.17", default-features = false, features = ["alloc"] }
linked_list_allocator = "0.10"
noto-sans-mono-bitmap = { version = "0.3", default-features = false, features = ["size_16", "regular", "unicode-basic-latin", "unicode-specials"] }

[target.'cfg(target_arch = "x86_64")'.dependencies]
bootloader-x86_64-common = { git = "https://github.com/rust-osdev/bootloader.git", rev = "707db11201b19541b7cfef84037866ee03aa0927" }
x86_64 = { version = "=0.15.4", features = ["instructions", "nightly"] }
pic8259 = "0.10.4"
uart_16550 = "0.3.2"

[target.'cfg(target_arch = "aarch64")'.dependencies]
aarch64-cpu = "9.4"
tock-registers = "0.8"
rlibc = "1.0"
