[package]
name = "libbreenix-libc"
version = "0.1.0"
edition = "2021"
authors = ["Ryan Breen"]
description = "C ABI wrappers for libbreenix - enables Rust std support"
license = "PolyForm-Noncommercial-1.0.0"

# This is a standalone library, not part of the kernel workspace
[workspace]

[lib]
crate-type = ["staticlib"]
name = "c"  # Produces libc.a

[features]
default = []

[dependencies]
libbreenix = { path = "../libbreenix", default-features = false }
