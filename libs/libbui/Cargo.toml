[package]
name = "libbui"
version = "0.1.0"
edition = "2021"
description = "Breenix UI Widget Toolkit"

[lib]
crate-type = ["rlib"]

[dependencies]
serde_json = { version = "=1.0.154", default-features = false, features = ["alloc"] }
libgfx = { path = "../libgfx" }

libbreenix = { path = "../libbreenix" }

[workspace]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("breenix"))'] }
