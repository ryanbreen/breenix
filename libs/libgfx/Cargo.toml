[package]
name = "libgfx"
version = "0.1.0"
edition = "2021"
description = "Breenix userspace graphics library: BreenGL drawing through BGL on the GPU core"

[workspace]

[lib]
crate-type = ["rlib"]

[dependencies]
bgl = { path = "../bgl" }
libbreenix = { path = "../libbreenix" }
libgfx-pixel = { path = "../libgfx-pixel" }
# The 16 px and 32 px bitmap fonts whose tables libgfx uploads (docs/gui/breengel.md 8.2).
noto-sans-mono-bitmap = { version = "0.3", default-features = false, features = ["size_16", "size_32", "regular", "unicode-basic-latin", "unicode-specials"] }
