[package]
name = "breengel"
version = "0.1.0"
edition = "2021"
description = "Breengel — Breenix Graphical Environment Library"

[lib]
crate-type = ["rlib"]

[dependencies]
serde_json = { version = "=1.0.154", default-features = false, features = ["alloc"] }
libbreenix = { path = "../libbreenix", features = ["std"] }
libfont = { path = "../libfont" }
libgfx = { path = "../libgfx" }
libbui = { path = "../libbui" }

[workspace]
