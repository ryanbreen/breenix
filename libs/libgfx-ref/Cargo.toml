[package]
name = "libgfx-ref"
version = "0.1.0"
edition = "2021"
description = "The CPU reference for BreenGL drawing: libgfx's former CPU raster, kept as a test oracle (docs/gui/gpu.md section 2.4)"

[workspace]

[lib]
crate-type = ["rlib"]

[dependencies]
noto-sans-mono-bitmap = { version = "0.3", default-features = false, features = ["size_16", "size_32", "regular", "unicode-basic-latin", "unicode-specials"] }
libfont = { path = "../libfont" }
libgfx-pixel = { path = "../libgfx-pixel" }
