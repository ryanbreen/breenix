[package]
name = "breenix-suite"
version = "0.1.0"
edition = "2021"
description = "Guest effort-suite harness and independent display expectations"
license = "PolyForm-Noncommercial-1.0.0"

[workspace]

# Keep the existing harness source paths so the structural guards continue to
# inspect the same implementation. The userspace programs package depends on this
# harness, so Cargo feature unification enables libbreenix suite auditing there.
[lib]
path = "../src/suite_lib.rs"

[dependencies]
libbreenix = { path = "..", features = ["std", "suite"] }
libgfx-ref = { path = "../../libgfx-ref" }
libpixcheck = { path = "../../libpixcheck" }
