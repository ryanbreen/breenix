[package]
name = "libbreenix"
version = "0.1.0"
edition = "2021"
authors = ["Ryan Breen"]
description = "Breenix userspace system call library"
license = "PolyForm-Noncommercial-1.0.0"

# This is a standalone library, not part of the kernel workspace
[workspace]

[lib]
crate-type = ["rlib"]

[[test]]
name = "observation_rows"
path = "../../tests/observation_rows.rs"

[[test]]
name = "bwm_clock"
path = "../../tests/bwm_clock.rs"
required-features = ["std"]

[[test]]
name = "bwm_validation"
path = "../../tests/bwm_validation.rs"
required-features = ["std"]

[[test]]
name = "input_abi"
path = "../../tests/input_abi.rs"

[features]
default = []
std = []
runtime = []
# Suite-mode upload auditing; the harness lives in the breenix-suite package.
suite = ["std"]

[dependencies]
input-abi = { path = "../input-abi" }
breengel-abi = { path = "../breengel-abi" }
# Syscall 416's layouts and the BGL command stream, shared with the kernel.
gpu-abi = { path = "../gpu-abi" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("breenix"))'] }
