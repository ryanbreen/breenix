[package]
name = "libbreenix"
version = "0.1.0"
edition = "2021"
authors = ["Ryan Breen <rbreen@cimpress.com>"]
description = "Breenix userspace system call library"
license = "MIT"

# This is a standalone library, not part of the kernel workspace
[workspace]

[lib]
crate-type = ["rlib"]

[features]
default = []
std = []
runtime = []
# The effort-suite runner (src/suite.rs): needs std, and libgfx for its panel.
suite = ["std", "dep:libgfx", "dep:libpixcheck"]

[dependencies]
breengel-abi = { path = "../breengel-abi" }
# A pure no_std library: the window ABI, and libgfx only with the suite feature.
libgfx = { path = "../libgfx", optional = true }
libpixcheck = { path = "../libpixcheck", optional = true }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("breenix"))'] }
