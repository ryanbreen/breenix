[package]
name = "libbreenix"
version = "0.1.0"
edition = "2021"
authors = ["Ryan Breen <rbreen@cimpress.com>"]
description = "Breenix userspace system call library"
license = "MIT"

# This is a standalone library, not part of the kernel workspace
[workspace]

[lib]
crate-type = ["rlib"]

[features]
default = []
std = []
runtime = []
# The effort-suite runner (src/suite.rs): needs std, and libgfx for its panel.
suite = ["std", "dep:libgfx"]

[dependencies]
# None by default - a pure no_std library. libgfx only with the suite feature.
libgfx = { path = "../libgfx", optional = true }
