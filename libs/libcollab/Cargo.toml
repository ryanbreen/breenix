[package]
name = "libcollab"
version = "0.1.0"
edition = "2021"
description = "Breenix collaboration protocol library — real-time multi-user session support"

[lib]
crate-type = ["rlib"]

[features]
default = []
net = ["dep:libbreenix"]

[dependencies]
libbreenix = { path = "../libbreenix", optional = true }
