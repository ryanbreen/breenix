[workspace]
resolver = "2"
members = ["bbench", "bsshd", "btest", "crates/bu-case", "crates/bu-sys", "yes"]

[workspace.package]
edition = "2021"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.dev]
panic = "abort"
overflow-checks = true
incremental = false

[profile.release]
panic = "abort"
opt-level = "z"
lto = "thin"
overflow-checks = true
incremental = false

# The crypto and SSH transport live in libbreenix. Their per-byte loops
# (ciphers, MACs, hashes, packet framing) are built for speed, not size.
[profile.release.package.libbreenix]
opt-level = 3

# bbench built again at opt-level 3 for the crypto rows; the shipped release profile uses z.
[profile.bench-o3]
inherits = "release"
opt-level = 3

[profile.dev-box]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
