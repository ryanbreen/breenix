[package]
name = "breenfs-host-tests"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
spin = "0.9"

[dev-dependencies]
serde_json = "1"
breenfs = { path = "../breenfs", artifact = ["bin:breenfs-mkfs", "bin:breenfs-check"] }

[lib]
doctest = false

[[bin]]
name = "breenfs-torture"
path = "src/bin/breenfs-torture.rs"

# Crash enumeration repeatedly decodes and checksums 16 KiB nodes. Optimize the
# harness and its checker artifacts while retaining arithmetic/runtime checks.
[profile.dev]
opt-level = 2
debug-assertions = true
overflow-checks = true
