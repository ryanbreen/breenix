[package]
name = "vfs-host-tests"
version = "0.1.0"
edition = "2021"
autotests = false

[workspace]

[dependencies]
spin = "0.9"
log = "0.4"
ufs-abi = { path = "../../libs/ufs-abi" }

[lib]
test = true
doctest = false

# These kernel-only gates appear in the shared VFS/adapter source.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("fs_fault_inject", "watchdog_fault_inject"))'] }

# The large directory fixture exercises encoded node walks.
[profile.test]
opt-level = 2
debug-assertions = true
overflow-checks = true
