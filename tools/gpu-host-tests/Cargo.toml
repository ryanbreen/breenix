[package]
name = "gpu-host-tests"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
gpu-abi = { path = "../../libs/gpu-abi", features = ["alloc"] }
libfont = { path = "../../libs/libfont" }
libgfx-ref = { path = "../../libs/libgfx-ref" }

[lib]
path = "tests.rs"

