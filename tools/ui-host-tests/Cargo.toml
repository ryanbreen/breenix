[package]
name = "ui-host-tests"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
libcollab = { path = "../../libs/libcollab", features = ["net"] }
breengel = { path = "../../libs/breengel" }
libbui = { path = "../../libs/libbui" }
libbreenix = { path = "../../libs/libbreenix", features = ["std"] }
libfont = { path = "../../libs/libfont" }
libgfx = { path = "../../libs/libgfx" }
libpixcheck = { path = "../../libs/libpixcheck" }
libimg = { path = "../../libs/libimg" }
libvt = { path = "../../libs/libvt" }
breenish-js = { path = "../../libs/breenish-js" }
libimg-encode = { path = "../../libs/libimg-encode" }
serde_json = "=1.0.154"

[[test]]
name = "ui_artifacts"
path = "../../tests/ui_artifacts.rs"

[[test]]
name = "ui_stored_frames"
path = "../../tests/ui_stored_frames.rs"

[[test]]
name = "uitest_arena"
path = "../../tests/uitest_arena.rs"

[[test]]
name = "ui_messages"
path = "../../tests/ui_messages.rs"

[[test]]
name = "ui_retention"
path = "../../tests/ui_retention.rs"

[[test]]
name = "gui_apps_shell_output"
path = "../../tests/gui_apps_shell_output.rs"

[[test]]
name = "blauncher_node"
path = "../../tests/blauncher_node.rs"

[[test]]
name = "guskit_collab"
path = "../../tests/guskit_collab.rs"

[[test]]
name = "gui_apps_wiring"
path = "../../tests/gui_apps_wiring.rs"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("breenix"))'] }

[[test]]
name = "guskit_argv"
path = "../../tests/guskit_argv.rs"

[[test]]
name = "guskit_session_dialog"
path = "../../tests/guskit_session_dialog.rs"

[[test]]
name = "guskit_dispatch"
path = "../../userspace/programs/src/guskit.rs"
