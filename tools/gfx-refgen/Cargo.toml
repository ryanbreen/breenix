[package]
name = "gfx-refgen"
default-run = "gfx-refgen"
version = "0.1.0"
edition = "2021"
description = "Renders the breengel suite's reviewed reference frames (docs/gui/breengel.md section 8.6)"
publish = false

[workspace]

[dependencies]
libgfx-ref = { path = "../../libs/libgfx-ref" }
libfont = { path = "../../libs/libfont" }
libicon = { path = "../../libs/libicon" }
libimg = { path = "../../libs/libimg" }
libimg-encode = { path = "../../libs/libimg-encode" }
serde_json = "=1.0.154"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("breenix"))'] }

[dev-dependencies]
libpixcheck = { path = "../../libs/libpixcheck" }
