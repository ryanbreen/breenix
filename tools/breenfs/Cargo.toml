[package]
name = "breenfs"
version = "0.1.0"
edition = "2021"

[workspace]

[lib]
name = "breenfs"

[dependencies]
spin = "0.9"

[dev-dependencies]
# Shared SHA-256 documentation examples name their owning crate.
libbreenix = { path = "../../libs/libbreenix", features = ["std"] }

# The property check walks encoded 16 KiB nodes after each operation.
[profile.test]
opt-level = 2
debug-assertions = true
overflow-checks = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("breenix"))', 'cfg(feature, values("breenfs_commit_window", "breenfs_corrupt_inject"))'] }
