# The E25 toolchain workspace (plan step 25.R, every tool in Rust).
#
# Rules (plan section 2): no dependency outside this workspace and std, so
# Cargo.lock holds only path packages (toolchain_workspace::lock_has_only_path_packages);
# no proc macros or build.rs; forbid unsafe in tools except bmake's signal
# FFI under E25 ruling 31;
# overflow checks on in every profile, the shipped one included.

[workspace]
resolver = "2"
members = ["bar", "bas", "bcc", "bld", "bmake", "bnm", "bobj", "brt", "elfcheck"]

[workspace.package]
edition = "2021"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.dev]
panic = "abort"
overflow-checks = true

[profile.release]
panic = "abort"
overflow-checks = true
codegen-units = 1
incremental = false

[profile.selfhost]
inherits = "release"
