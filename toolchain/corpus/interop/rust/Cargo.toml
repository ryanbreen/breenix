[package]
name = "interop"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[lib]
crate-type = ["staticlib"]
test = false
doctest = false

[target.'cfg(all(target_os = "linux", target_arch = "aarch64"))'.dependencies]
linux-test = { path = "../../../rt/linux-test" }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
codegen-units = 1
incremental = false
