# OpenSSL 3.5 Configurations/README.md and INSTALL.md.
my %targets = (
    "breenix-x86_64" => {
        inherit_from => [ "BASE_unix" ],
        bn_ops => "SIXTY_FOUR_BIT_LONG",
        thread_scheme => "pthreads",
        perlasm_scheme => "elf",
        disable => [ "apps", "asm", "async", "dso", "engine", "module" ],
        # Seed from the real hosted libc entropy interface.
        defines => [ "OPENSSL_RAND_SEED_GETRANDOM" ],
    },
);
