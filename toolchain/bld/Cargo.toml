[package]
name = "bld"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = "Breenix static linker"

[lints]
workspace = true

[dependencies]
bobj = { path = "../bobj" }

[dev-dependencies]
elfcheck = { path = "../elfcheck" }

[features]
read-fault-probe = []

[[bin]]
name = "bld-read-probe"
path = "src/bin/read_probe.rs"
required-features = ["read-fault-probe"]
