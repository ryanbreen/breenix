[package]
name = "elfcheck"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = "Checks ELF64 x86-64 and AArch64 relocatable objects and static executables against the gABI, the AMD64 psABI, AAELF64 and LSB Core 5.0"

[lib]
path = "src/lib.rs"

[[bin]]
name = "elfcheck"
path = "src/main.rs"

[lints]
workspace = true
