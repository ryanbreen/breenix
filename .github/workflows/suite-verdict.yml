name: Suite verdict

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Suite scorer and caller host tests
        run: python3 -m unittest discover -s tests -p 'suite*_test.py'
